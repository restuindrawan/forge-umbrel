version: "3.7"

services:

  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: sparkles-t3_server_1
      APP_PORT: 3773

  server:
    image: ghcr.io/restuindrawan/sparkles-t3:0.1.2
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      HOME: /home/node
    volumes:
      - ${APP_DATA_DIR}/data/t3:/home/node/
    working_dir: /home/node/projects
    ports:
      - "4098:3773"
