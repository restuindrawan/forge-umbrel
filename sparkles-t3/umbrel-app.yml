manifestVersion: 1
id: sparkles-t3
storage:
  dataRoot: data
name: T3 Code
tagline: Control your coding agents from anywhere
icon: https://t3.codes/favicon.ico
category: Development
version: "0.1.2-3"
port: 4098
description: >-
  T3 Code is a self-hosted control surface for coding agents such as Codex,
  Claude Code, and OpenCode. This app runs the T3 Code server on your umbrelOS
  device so you can connect from the web, desktop, or mobile app.


  To connect another device (desktop app, phone, or another browser), add an
  environment there with http://<your-umbrel-address>:4100 and a pairing
  token. A fresh pairing link is printed in the app logs on every start, or run
  "docker exec sparkles-t3_server_1 t3-pair" over SSH to create a new one.


  Claude Code, Codex, and OpenCode are preinstalled in the container. Sign in
  once over SSH, then enable the provider in T3 Code under Settings > Providers.
  Logins are kept in the app's data folder.

  docker exec -it sparkles-t3_server_1 claude auth login

  docker exec -it sparkles-t3_server_1 codex login --device-auth

  docker exec -it sparkles-t3_server_1 opencode auth login


  Project files go in the projects folder.

developer: T3 Tools
website: https://t3.codes
submitter: Sparkles
submission: https://github.com/pingdotgg/t3code
repo: https://github.com/pingdotgg/t3code
support: https://github.com/pingdotgg/t3code/issues
gallery: []
releaseNotes: >-
  Adds Claude Code, Codex, and OpenCode to the image so T3 Code finds a
  provider out of the box. Also includes the remote access fixes: the direct
  connection port is now 4100 (it used to clash with the app proxy on 4098),
  and a pairing link is printed on startup.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
