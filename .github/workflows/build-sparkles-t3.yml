name: Build sparkles-t3 image

on:
  push:
    branches: [master]
    paths:
      - "sparkles-t3/image/**"
      - ".github/workflows/build-sparkles-t3.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: sparkles-t3/image
          platforms: linux/amd64
          push: true
          build-args: T3_VERSION=0.1.3-nightly.20261024.3604
          tags: |
            ghcr.io/restuindrawan/sparkles-t3:0.1.3-nightly.20261024.3604
            ghcr.io/restuindrawan/sparkles-t3:nightly
