version: "3.7"

services:

  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: sparkles-opencode_server_1
      APP_PORT: 4096

  server:
    image: ghcr.io/anomalyco/opencode:2.1.4
    user: "1000:1000"
    init: true
    restart: on-failure
    command: serve --hostname 0.0.0.0 --port 4096
    environment:
      HOME: /home/opencode
    volumes:
      - ${APP_DATA_DIR}/data/opencode:/home/opencode/
    working_dir: /home/opencode/projects
