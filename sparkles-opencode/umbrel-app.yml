manifestVersion: 1
id: sparkles-opencode
storage:
  dataRoot: data
name: OpenCode
tagline: Open source AI coding agent
icon: https://opencode.ai/favicon.svg
category: Development
version: "2.1.4-1"
port: 4096
description: >-
  OpenCode is an open source AI coding agent. This app runs the OpenCode V2
  server and web interface on your umbrelOS device.


  Global configuration lives at .config/opencode/opencode.jsonc in the app's
  data folder. Project files go in the projects folder.


  The server is protected by a fixed password (username "opencode") shown in
  the app's credentials. To attach a terminal from another device, run:
  OPENCODE_PASSWORD=<password> opencode --server http://<your-umbrel-address>:4097

developer: OpenCode
website: https://opencode.ai
submitter: Sparkles
submission: https://github.com/anomalyco/opencode
repo: https://github.com/anomalyco/opencode
support: https://github.com/anomalyco/opencode/issues
gallery: []
releaseNotes: >-
  Use a fixed server password so remote clients can connect. Previously OpenCode generated a new random password on every start.
dependencies: []
path: ""
deterministicPassword: true
defaultUsername: "opencode"
defaultPassword: ""
